---
name: Publish image
description: Publish artifacts on the default branch.
inputs:
  checkout:
    description: Run checkout action
    default: "true"
  # docker.io
  docker_hub_organization:
    description: DockerHub organization
    default: prom
  docker_hub_login:
    description: DockerHub username
    default: prombot
  docker_hub_password:
    description: DockerHub password
  # ghcr.io
  ghcr_io_organization:
    description: ghcr.io organization
    default: prometheus
  ghcr_io_login:
    description: ghcr.io username
    default: prometheus
  ghcr_io_password:
    description: ghcr.io password
  # quay.io
  quay_io_organization:
    description: Quay.io organization
    default: prometheus
  quay_io_login:
    description: Quay.io username
    default: prombot
  quay_io_password:
    description: Quay.io password
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.checkout == 'true'
      with:
        persist-credentials: false
    - uses: prometheus/promci-setup@55bd31fe92710532260eb57c554f2697363285c5 # v0.2.2
      with:
        enable_docker_multibuild: true
    - uses: prometheus/promci-artifacts/restore@9ca3252d07f230d5f923452b4df5697eba4a5bee # v0.1.1
    - uses: prometheus/promci-images/publish@ae9365cc76277345b9616767215b106ea72ce738 # v0.2.0
      if: ${{ inputs.docker_hub_organization != '' && inputs.docker_hub_login != '' && inputs.docker_hub_password != '' }}
      with:
        registry: docker.io
        organization: ${{ inputs.docker_hub_organization }}
        login: ${{ inputs.docker_hub_login }}
        password: ${{ inputs.docker_hub_password }}
    - uses: prometheus/promci-images/publish@ae9365cc76277345b9616767215b106ea72ce738 # v0.2.0
      if: ${{ inputs.ghcr_io_organization != '' && inputs.ghcr_io_login != '' && inputs.ghcr_io_password != ''}}
      with:
        registry: ghcr.io
        organization: ${{ inputs.ghcr_io_organization }}
        login: ${{ inputs.ghcr_io_login }}
        password: ${{ inputs.ghcr_io_password }}
    - uses: prometheus/promci-images/publish@ae9365cc76277345b9616767215b106ea72ce738 # v0.2.0
      if: ${{ inputs.quay_io_organization != '' && inputs.quay_io_login != '' && inputs.quay_io_password != ''}}
      with:
        registry: quay.io
        organization: ${{ inputs.quay_io_organization }}
        login: ${{ inputs.quay_io_login }}
        password: ${{ inputs.quay_io_password }}
