name: Publish release
description: Publish tagged release artifacts
inputs:
  checkout:
    description: Run checkout action
    default: "true"
  # docker.io
  docker_hub_organization:
    description: DockerHub organization
    default: prom
  docker_hub_login:
    description: DockerHub username
    default: prombot
  docker_hub_password:
    description: DockerHub password
  # ghcr.io
  ghcr_io_organization:
    description: ghcr.io organization
    default: prometheus
  ghcr_io_login:
    description: ghcr.io username
    default: prometheus
  ghcr_io_password:
    description: ghcr.io password
  # quay.io
  quay_io_organization:
    description: Quay.io organization
    default: prometheus
  quay_io_login:
    description: Quay.io username
    default: prombot
  quay_io_password:
    description: Quay.io password
  # Token for github release publishing.
  github_token:
    description: Github Token
  promu_config:
    description: Config file for promu
    default: .promu.yml
  skip_github_release:
    description: Skip promu tarball/checksum/GitHub release steps (docker-only publish)
    default: "false"
  # Secondary / custom image publishing
  working_directory:
    description: Directory passed to make -C (for secondary images with their own Makefile)
    default: "."
  skip_manifest:
    description: Skip make docker-manifest (for single-arch Makefiles without that target)
    default: "false"
  extra_make_args:
    description: Extra arguments appended to make invocations (e.g. REPO_TAG=v1.2.3)
    default: ""
  dockerfile_path:
    description: Path to Dockerfile (forwarded to promci-images)
    default: ""
  dockerbuild_context:
    description: Path to Docker build context (forwarded to promci-images)
    default: ""
  container_image_name:
    description: Name of the container image (forwarded to promci-images)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.checkout == 'true'
      with:
        persist-credentials: false
        fetch-tags: true
    - uses: prometheus/promci-setup@55bd31fe92710532260eb57c554f2697363285c5 # v0.2.2
      with:
        enable_docker_multibuild: true
        clean-runner-disk: true
    - uses: prometheus/promci-artifacts/restore@9ca3252d07f230d5f923452b4df5697eba4a5bee # v0.1.1
    - name: Crossbuild tarballs
      if: inputs.skip_github_release != 'true'
      run: ~/go/bin/promu -c ${{ inputs.promu_config}} crossbuild tarballs
      shell: bash
    - name: Crossbuild checksum
      if: inputs.skip_github_release != 'true'
      run: ~/go/bin/promu -c ${{ inputs.promu_config}} checksum .tarballs
      shell: bash
    - name: Crossbuild release
      if: inputs.skip_github_release != 'true'
      run: ~/go/bin/promu -c ${{ inputs.promu_config}} release .tarballs
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
    - uses: prometheus/promci-images/publish_release@ae9365cc76277345b9616767215b106ea72ce738 # v0.2.0
      if: ${{ inputs.docker_hub_organization != '' && inputs.docker_hub_login != '' && inputs.docker_hub_password != '' }}
      with:
        registry: docker.io
        organization: ${{ inputs.docker_hub_organization }}
        login: ${{ inputs.docker_hub_login }}
        password: ${{ inputs.docker_hub_password }}
        working_directory: ${{ inputs.working_directory }}
        skip_manifest: ${{ inputs.skip_manifest }}
        extra_make_args: ${{ inputs.extra_make_args }}
        dockerfile_path: ${{ inputs.dockerfile_path }}
        dockerbuild_context: ${{ inputs.dockerbuild_context }}
        container_image_name: ${{ inputs.container_image_name }}
    - uses: prometheus/promci-images/publish_release@ae9365cc76277345b9616767215b106ea72ce738 # v0.2.0
      if: ${{ inputs.ghcr_io_organization != '' && inputs.ghcr_io_login != '' && inputs.ghcr_io_password != ''}}
      with:
        registry: ghcr.io
        organization: ${{ inputs.ghcr_io_organization }}
        login: ${{ inputs.ghcr_io_login }}
        password: ${{ inputs.ghcr_io_password }}
        working_directory: ${{ inputs.working_directory }}
        skip_manifest: ${{ inputs.skip_manifest }}
        extra_make_args: ${{ inputs.extra_make_args }}
        dockerfile_path: ${{ inputs.dockerfile_path }}
        dockerbuild_context: ${{ inputs.dockerbuild_context }}
        container_image_name: ${{ inputs.container_image_name }}
    - uses: prometheus/promci-images/publish_release@ae9365cc76277345b9616767215b106ea72ce738 # v0.2.0
      if: ${{ inputs.quay_io_organization != '' && inputs.quay_io_login != '' && inputs.quay_io_password != ''}}
      with:
        registry: quay.io
        organization: ${{ inputs.quay_io_organization }}
        login: ${{ inputs.quay_io_login }}
        password: ${{ inputs.quay_io_password }}
        working_directory: ${{ inputs.working_directory }}
        skip_manifest: ${{ inputs.skip_manifest }}
        extra_make_args: ${{ inputs.extra_make_args }}
        dockerfile_path: ${{ inputs.dockerfile_path }}
        dockerbuild_context: ${{ inputs.dockerbuild_context }}
        container_image_name: ${{ inputs.container_image_name }}
